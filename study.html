<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study — LearnKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="app.html">
        <span class="mark">LK</span>
        <strong>LearnKit</strong>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost" href="app.html">Library</a>
        <button class="btn btn-ghost" type="button" data-logout>Sign out</button>
      </div>
    </header>

    <div class="status-banner" data-banner></div>

    <main class="study-shell panel">
      <p class="muted" data-study-meta>Study</p>
      <h1 data-study-title>Loading…</h1>
      <div class="progress-bar" data-progress><span></span></div>
      <div data-stage></div>
      <div class="row" data-actions style="margin-top: 18px"></div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/study.js"></script>
  </body>
</html>
