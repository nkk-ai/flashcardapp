<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library — LearnKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="app.html">
        <span class="mark">LK</span>
        <strong>LearnKit</strong>
      </a>
      <div class="nav-actions">
        <span class="muted" data-who></span>
        <button class="btn btn-ghost" type="button" data-logout>Sign out</button>
      </div>
    </header>

    <div class="status-banner" data-banner></div>

    <main class="layout grid-2">
      <section class="panel">
        <h2>New study set</h2>
        <p class="muted">Upload notes. We extract the text, then Gemini builds a quiz and flashcards.</p>
        <form data-upload>
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="Biology lecture 4" />
          <label for="file">File (.pdf, .docx, .txt, .md)</label>
          <input id="file" name="file" type="file" accept=".pdf,.docx,.txt,.md,application/pdf,text/plain" required />
          <p><button class="btn btn-primary" type="submit">Generate study set</button></p>
        </form>
      </section>

      <section>
        <h2>Your library</h2>
        <p class="empty" data-empty>No sets yet. Upload a file to create the first one.</p>
        <div class="set-list" data-sets></div>
      </section>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
